name: Build

# Builds the image for the InvoicePlane release pinned in UPSTREAM_VERSION,
# applies patches/series, smoke-tests it and (on main) pushes to ghcr.io.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream pin
        id: pin
        run: |
          echo "version=$(tr -d '[:space:]' < UPSTREAM_VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(tr -d '[:space:]' < UPSTREAM_SHA256)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gabbaya:test
          build-args: |
            INVOICEPLANE_VERSION=${{ steps.pin.outputs.version }}
            INVOICEPLANE_SHA256=${{ steps.pin.outputs.sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker network create gabbaya-test
          docker run -d --name db --network gabbaya-test \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=ip \
            -e MARIADB_USER=ip -e MARIADB_PASSWORD=ip \
            mariadb:11 --character-set-server=utf8mb4
          docker run -d --name app --network gabbaya-test -p 8080:80 \
            -e IP_URL=http://localhost:8080 \
            -e IP_DB_HOSTNAME=db -e IP_DB_DATABASE=ip \
            -e IP_DB_USERNAME=ip -e IP_DB_PASSWORD=ip \
            gabbaya:test

          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            case "$code" in 200|302|307) break ;; esac
            sleep 2
          done
          echo "HTTP / -> $code"
          [ "$code" = 200 ] || [ "$code" = 302 ] || [ "$code" = 307 ] || { docker logs app; exit 1; }

          # Version and patch series baked in as expected
          test "$(docker exec app cat /var/www/html/.invoiceplane-version)" = "${{ steps.pin.outputs.version }}"
          echo "Applied patches:"; docker exec app cat /var/www/html/.gabbaya-patches

          # ipconfig.php lives in the persistent /config volume
          docker exec app test -L /var/www/html/ipconfig.php
          docker exec app test -f /config/ipconfig.php

          # No PHP fatals during start-up
          if docker exec app sh -c 'cat /var/log/apache2/php_errors.log 2>/dev/null' | grep -i 'fatal'; then
            exit 1
          fi

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.pin.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.short }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.pin.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            INVOICEPLANE_VERSION=${{ steps.pin.outputs.version }}
            INVOICEPLANE_SHA256=${{ steps.pin.outputs.sha256 }}
          cache-from: type=gha
